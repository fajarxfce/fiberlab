map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

map $http_origin $fiberlab_origin_allowed {
    default 0;
    "" 1;
    "https://sim.karuhundeveloper.com" 1;
    "http://127.0.0.1:18080" 1;
    "http://localhost:18080" 1;
}

server {
    listen 127.0.0.1:18080;
    server_name sim.karuhundeveloper.com localhost 127.0.0.1;
    client_max_body_size 16m;
    auth_basic "Fiberlab";
    auth_basic_user_file /etc/nginx/fiberlab.htpasswd;

    if ($fiberlab_origin_allowed = 0) {
        return 403;
    }

    location /internal/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:18787;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:18787;
        proxy_set_header Origin "";
        proxy_set_header Authorization "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
