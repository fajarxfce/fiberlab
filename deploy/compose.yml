name: fiberlab

services:
  runtime:
    image: ${FIBERLAB_IMAGE:?Image is required}
    user: "0:0"
    privileged: true
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      default:
        ipv4_address: 172.18.0.2
    ports:
      - "127.0.0.1:18787:18788"
    restart: unless-stopped
    init: true
    entrypoint: [/usr/local/bin/fiberlab-runtime]
    command: []
    group_add: ["${KVM_GID:?KVM group is required}"]
    volumes:
      - ${DEPLOY_ROOT:?Deployment directory is required}/shared/data:/data
      - /var/lib/fiberlab:/var/lib/fiberlab
    stop_grace_period: 60s
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --max-time 2 --unix-socket /data/netd.sock http://localhost/health > /dev/null &&
          curl --fail --silent --max-time 2 http://127.0.0.1:18788/api/v1/health > /dev/null
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  web:
    image: nginx:stable-alpine
    network_mode: host
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    volumes:
      - ${DEPLOY_ROOT}/current/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${DEPLOY_ROOT}/shared/htpasswd:/etc/nginx/fiberlab.htpasswd:ro
    depends_on:
      runtime:
        condition: service_healthy

networks:
  default:
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1
